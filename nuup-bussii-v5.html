};

// STATE
let map,activeStop=null,favorites=[],adminMode=false,editorMap=null;
const HOLIDAYS=new Set(['01-01','01-06','05-01','06-21','12-24','12-25','12-26','12-31']);

// HELPERS
function nuukNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Godthab'}));}
function toMins(t){if(!t||t==='-')return null;const[h,m]=t.split(':').map(Number);return h*60+m;}
function fmtMins(m){if(m==null)return null;const h=Math.floor(m/60)%24,mm=m%60;return`${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;}
function minsLabel(m){if(m<=0)return'now';if(m<60)return`${m}m`;return`${Math.floor(m/60)}h ${m%60}m`;}
function getSchedule(d){const dow=d.getDay(),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return(dow===0||dow===6||HOLIDAYS.has(`${mm}-${dd}`))?' weekend':'weekday';}

function getPickedDate(){const d=document.getElementById('pick-date').value;return d?new Date(d+'T12:00:00'):nuukNow();}
function getPickedSched(){return getSchedule(getPickedDate());}
function getPickedMins(){const t=document.getElementById('pick-time').value;if(!t){const n=nuukNow();return n.getHours()*60+n.getMinutes();}return toMins(t+':00')||0;}

function getStopTimes(sk,sid){
  const result=[];
  for(const[rk,rt]of Object.entries(TIMETABLES)){
    const routeData=rt.data[sk];
    if(!routeData)continue;
    const col=routeData.stops.indexOf(parseInt(sid));
    if(col<0)continue;
    const times=routeData.trips.map(trip=>toMins(trip[col])).filter(Boolean);
    result.push({rk,label:rt.label,color:rt.color,times});
  }
  return result;
}

// MAP
function initMap(){
  map=L.map('map').setView([64.1858,-51.7150],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:19}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  for(const[sid,[lat,lng,name]]of Object.entries(STOPS)){
    const mk=L.marker([lat,lng],{icon:L.divIcon({html:`<div style="background:#1a73e8;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer" title="${name}">${sid}</div>`,className:'',iconSize:[28,28]})});
    mk.on('click',()=>selectStop(parseInt(sid)));
    mk.addTo(map);
  }
  document.getElementById('sheet-handle-wrap').addEventListener('click',()=>{
    if(adminMode)return;
    const s=document.getElementById('sheet');
    s.classList.toggle('half');
    s.classList.toggle('full');
  });
  renderDefaultSheet();
}

function selectStop(sid){
  activeStop=sid;
  const[lat,lng,name]=STOPS[sid];
  const sk=getPickedSched();
  const fromMins=getPickedMins();
  const routeData=getStopTimes(sk,sid);
  let html=`<div style="margin-bottom:16px"><div style="font-size:20px;font-weight:700">${name}</div><div style="font-size:12px;color:#9aa0a6">Stop #${sid}</div></div>`;
  if(routeData.length===0)html+=`<div style="color:#bbb">No service</div>`;
  for(const{rk,label,color,times}of routeData){
    const upcoming=times.filter(m=>m>=fromMins).slice(0,5);
    html+=`<div style="margin:12px 0"><div style="background:${color};color:#fff;display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700">${label}</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px">`;
    if(upcoming.length>0){
      for(let i=0;i<upcoming.length;i++){
        const m=upcoming[i];
        const cls=i===0?'chip-next':'chip-soon';
        const suffix=i===0?` (${minsLabel(m-fromMins)})`:'';
        html+=`<span class="chip ${cls}">${fmtMins(m)}${suffix}</span>`;
      }
    }else{html+=`<span style="color:#bbb;font-size:12px">No more</span>`;}
    html+=`</div></div>`;
  }
  document.getElementById('sheet-scroll').innerHTML=html;
  document.getElementById('sheet').classList.remove('full');
  document.getElementById('sheet').classList.add('half');
}

function renderDefaultSheet(){
  document.getElementById('sheet-scroll').innerHTML=`<div style="padding:10px">Welcome to Nuup Bussii+</div>`;
  document.getElementById('sheet').classList.add('half');
  document.getElementById('sheet').classList.remove('full');
}

// ADMIN
function toggleAdmin(){
  adminMode=!adminMode;
  if(adminMode){
    document.getElementById('admin-editor').classList.add('show');
    document.getElementById('fabs').classList.add('hidden');
    document.getElementById('sheet').classList.add('hidden');
    switchTab('stops');
  }else{
    closeAdmin();
  }
}

function closeAdmin(){
  adminMode=false;
  document.getElementById('admin-editor').classList.remove('show');
  document.getElementById('fabs').classList.remove('hidden');
  document.getElementById('sheet').classList.remove('hidden');
  if(editorMap){editorMap.off();editorMap.remove();editorMap=null;}
}

function switchTab(tab){
  document.querySelectorAll('.editor-tab').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  const c=document.getElementById('editor-content');
  if(tab==='stops'){
    c.innerHTML=`<div style="height:100%;display:flex;flex-direction:column"><div style="background:#f8f9fa;padding:12px;border-radius:8px;margin-bottom:12px"><h3 style="font-size:13px;font-weight:700;margin-bottom:8px">📍 Stop Editor</h3><p style="font-size:11px;color:#5f6368">Drag stops on map vs bus.gl live map</p></div><div id="editor-map"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="editor-btn success" style="flex:1" onclick="saveStops()">💾 Save</button><button class="editor-btn" style="flex:1" onclick="exportStops()">📤 Export</button></div></div>`;
    setTimeout(initEditorMap,200);
  }else if(tab==='timetables'){
    renderTimetablesTab();
  }else if(tab==='data'){
    renderDataTab();
  }
}

function initEditorMap(){
  const el=document.getElementById('editor-map');
  if(!el)return;
  editorMap=L.map(el).setView([64.1858,-51.7150],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(editorMap);
  for(const[sid,[lat,lng,name]]of Object.entries(STOPS)){
    const mk=L.marker([lat,lng],{draggable:true});
    mk.bindPopup(`${name} (#${sid})`);
    mk.on('dragend',()=>{
      const p=mk.getLatLng();
      STOPS[sid]=[p.lat,p.lng,name];
    });
    mk.addTo(editorMap);
  }
}

function saveStops(){
  if(!editorMap)return;
  alert('✓ Stops saved to memory');
}

function exportStops(){
  const js=`// Stops export\nconst STOPS = ${JSON.stringify(STOPS,null,2)};`;

  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='stops.js';
  a.click();
  alert('✓ Exported stops.js');

function renderTimetablesTab(){
  const html=`
    <div>
      <h3 style="font-size:13px;font-weight:700;margin-bottom:8px">Select Route</h3>

      <pre style="background:#f8f9fa;padding:10px;border-radius:8px;font-size:10px;overflow-x:auto">ROUTEID|DAY
STOPID,STOPID,...
TIME TIME TIME ...
TIME TIME TIME ...</pre>
      <textarea id="import-text" placeholder="Paste timetable data..." style="width:100%;padding:10px;border:1.5px solid #dadce0;border-radius:8px;font-family:monospace;font-size:11px;min-height:200px;margin:12px 0"></textarea>
      <button class="editor-btn success" style="width:100%" onclick="importTimetables()">📥 Import</button>
    </div>
  `;
  document.getElementById('editor-content').innerHTML=html;
}

function importTimetables(){
  const text=document.getElementById('import-text').value.trim();
  if(!text)return;
  const lines=text.split('\n').filter(l=>l.trim());
  let idx=0;
  while(idx<lines.length){
    const[rk,day]=lines[idx].split('|');
    const stops=lines[idx+1].split(',').map(s=>parseInt(s.trim()));
    const trips=[];
    idx+=2;
    while(idx<lines.length&&!lines[idx].includes('|')){
      trips.push(lines[idx].trim().split(/\s+/));
      idx++;
    }
    if(TIMETABLES[rk]){
      TIMETABLES[rk].data[day]={stops,trips};
    }
  }
  saveTimetables();
  alert('✓ Imported!');
}

function renderDataTab(){
  const html=`
    <div>
      <h3 style="font-size:13px;font-weight:700;margin-bottom:8px">💾 Export Data</h3>
      <p style="font-size:11px;color:#5f6368;margin-bottom:12px">Export timetables + stops as JavaScript code</p>

  document.getElementById('editor-content').innerHTML=html;

function exportData(){

// Generated: ${new Date().toISOString()}
// Include in HTML: <script src="backups/data.js"><\/script>

const TIMETABLES = ${JSON.stringify(TIMETABLES,null,2)};

const STOPS = ${JSON.stringify(STOPS,null,2)};`;
  const b=new Blob([js],{type:'text/javascript'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='data.js';
  a.click();
  alert('✓ Exported data.js\n\nSave to: backups/data.js\nThen uncomment script tag in HTML');
}

// STORAGE

async function loadTimetables(){try{const r=await window.storage.get('tt_v5');if(r)TIMETABLES=JSON.parse(r.value);}catch{}}

  const now=nuukNow();
  const d=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const t=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('pick-date').value=d;
  document.getElementById('pick-time').value=t;
  function update(){
    const sk=getPickedSched();
    document.getElementById('sched-badge').textContent=sk==='weekday'?'Weekday':'Weekend';
    document.getElementById('sched-badge').className=`sched-badge ${sk==='weekday'?'s-wd':'s-we'}`;
    if(activeStop)selectStop(activeStop);
  }
  document.getElementById('pick-date').addEventListener('change',update);
  document.getElementById('pick-time').addEventListener('change',update);
}

// INIT
window.addEventListener('DOMContentLoaded',async()=>{
  await loadTimetables();
  initPickers();
  initMap();
});
</script>
</body>
